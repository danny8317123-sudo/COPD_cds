<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>COPD Sustainable Rx Assist｜SMART 授權</title>
<script src="https://cdn.jsdelivr.net/npm/fhirclient@2.6.3/build/fhir-client.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#17365d,#0f766e);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.box{max-width:600px;text-align:center}.icon{font-size:48px}.sub{opacity:.82;line-height:1.8}.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-left-color:#fff;border-radius:50%;animation:s .8s linear infinite;margin:24px auto}@keyframes s{to{transform:rotate(360deg)}}.err{display:none;margin-top:20px;padding:16px;background:rgba(160,20,20,.25);border:1px solid rgba(255,255,255,.4);border-radius:10px;text-align:left}.err.show{display:block}code{background:rgba(0,0,0,.25);padding:2px 5px;border-radius:4px}</style></head>
<body><div class="box"><div class="icon">🫁</div><h1>COPD Sustainable Rx Assist</h1><div class="sub">正在透過 SMART on FHIR 取得病人情境與授權…<br>Clinical first · Carbon second</div><div class="spin" id="spin"></div><div class="err" id="err"><strong>授權啟動失敗</strong><div id="msg" style="margin-top:8px"></div><div style="margin-top:10px">本頁需由 EHR / SMART Launcher 啟動（需 <code>iss</code> 與 <code>launch</code>）。</div></div></div>
<script>FHIR.oauth2.authorize({clientId:"copd_sustainable_rx_advisory",scope:"launch openid fhirUser patient/Patient.read patient/Observation.read patient/MedicationRequest.read patient/Condition.read patient/Encounter.read patient/QuestionnaireResponse.read",redirectUri:"copd_fhir.html"}).catch(e=>{document.getElementById("spin").style.display="none";document.getElementById("err").classList.add("show");document.getElementById("msg").textContent=e?.message||String(e)});</script></body></html>
